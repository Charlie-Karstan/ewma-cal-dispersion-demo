[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prof2-ewma-cal"
version = "2.2.1"
description = "EWMA-CAL dispersion signals, position replay, and portfolio analysis"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.12,<2", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
notebook = ["jinja2>=3.1,<4", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]
benchmark = ["yfinance>=0.2.55,<2"]

[project.scripts]
ewma-cal = "ewma_cal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -e '.[dev,notebook]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -q
      - run: ewma-cal reference
      - name: Execute public notebook without market inputs
        run: |
          python - <<'PYTHON'
          import nbformat
          from nbclient import NotebookClient
          notebook = nbformat.read("notebooks/prof2_EWMA_CAL.ipynb", as_version=4)
          NotebookClient(notebook, timeout=180, resources={"metadata": {"path": "."}}).execute()
          PYTHON
